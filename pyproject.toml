[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flakeguard"
version = "0.1.0"
description = "Predicting flaky tests from static and lightweight dynamic features, without re-execution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "xgboost",
    "shap",
    "matplotlib",
    "seaborn",
    "scipy",
    "jinja2",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
flakeguard = "flakeguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
